name: Prospecting Agent

on:
  schedule:
    - cron: '0 8 * * 1-5'  # Chaque jour ouvré à 8h UTC
  workflow_dispatch:       # Déclenchement manuel

env:
  NODE_VERSION: '20'

jobs:
  run:
    name: Daily Prospecting Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run prospecting pipeline
        run: pnpm --filter datapresent-prospecting start -- --stage all --dry-run
        env:
          NODE_ENV: production
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROSPECTING_SENDER: ${{ secrets.PROSPECTING_SENDER }}
          PROSPECTING_OPTOUT_URL: ${{ secrets.PROSPECTING_OPTOUT_URL }}
          RUNNER_HOST: github
          CHROME_PATH: ''

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datapresent-prospecting/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(prospecting): update prospects data

            Automated daily prospecting run."
            git push
          fi
